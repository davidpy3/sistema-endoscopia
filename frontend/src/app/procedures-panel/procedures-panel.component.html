<section class="procedures-shell card">
  <div class="section-head">
    <div>
      <p class="eyebrow">Catálogo</p>
      <h2>Procedimientos gastroenterológicos</h2>
      <p>Los procedimientos están agrupados por tipo y cada pestaña incluye sus datos clínicos y adjuntos.</p>
    </div>
  </div>

  <nav class="procedure-tabs" aria-label="Tipos de procedimiento">
    <button
      *ngFor="let tab of tabs()"
      type="button"
      class="procedure-tab"
      [class.active]="activeSection === tab.id"
      (click)="selectCategory(tab.id)"
    >
      <span>{{ tab.label }}</span>
      <small>{{ tab.description }}</small>
    </button>
  </nav>

  <section class="procedure-section" *ngIf="activeSection === 'procedimientos'">
    <div class="procedure-catalog-grid" *ngIf="filteredProcedures().length; else emptyState">
      <article class="procedure-catalog-card" *ngFor="let item of filteredProcedures()">
        <div class="catalog-head">
          <span class="chip">{{ item.code }}</span>
          <span class="chip">#{{ item.id }}</span>
          <strong>{{ item.name }}</strong>
        </div>
        <p>{{ item.description }}</p>
        <small>{{ item.scope }}</small>
      </article>
    </div>
  </section>

  <section class="procedure-section" *ngIf="activeSection === 'imagenes'">
    <app-image-categories-panel [images]="imagesList()"></app-image-categories-panel>
  </section>

  <ng-template #emptyState>
    <p class="empty-note">No hay procedimientos para esta categoría.</p>
  </ng-template>
</section>
