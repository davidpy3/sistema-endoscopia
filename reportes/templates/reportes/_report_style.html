<style>
	@page {
		size: A4;
		margin: 12mm 10mm;
	}

	:root {
		--ink: #1f2937;
		--muted: #6b7280;
		--line: #d7dee8;
		--soft: #eff6f5;
		--accent: #0f766e;
		--accent-2: #115e59;
	}

	* {
		box-sizing: border-box;
	}

	body {
		margin: 0;
		font-family: Arial, Helvetica, sans-serif;
		color: var(--ink);
		background: #f3f6f9;
	}

	.page {
		background: #fff;
		padding: 18px 20px 22px;
	}

	.header {
		display: flex;
		justify-content: space-between;
		gap: 16px;
		align-items: flex-start;
		padding-bottom: 12px;
		margin-bottom: 14px;
		border-bottom: 2px solid var(--accent);
	}

	.hospital {
		font-size: 13px;
		font-weight: 700;
		letter-spacing: 0.04em;
		text-transform: uppercase;
	}

	.service {
		font-size: 11px;
		color: var(--muted);
		margin-top: 2px;
	}

	.badge {
		display: inline-block;
		padding: 3px 10px;
		border-radius: 999px;
		background: var(--soft);
		color: var(--accent-2);
		font-size: 10px;
		font-weight: 700;
		letter-spacing: 0.04em;
	}

	.title {
		margin: 0 0 6px;
		font-size: 20px;
		font-weight: 800;
		color: var(--accent);
		text-transform: uppercase;
	}

	.subtitle {
		font-size: 12px;
		color: var(--muted);
	}

	.card {
		border: 1px solid var(--line);
		border-radius: 10px;
		padding: 12px;
		background: #fff;
	}

	.section {
		margin-top: 14px;
	}

	.section h2 {
		margin: 0 0 8px;
		padding-bottom: 4px;
		border-bottom: 1px solid var(--line);
		font-size: 13px;
		text-transform: uppercase;
		color: var(--accent-2);
	}

	.table {
		width: 100%;
		border-collapse: collapse;
		font-size: 11px;
	}

	.table th,
	.table td {
		border: 1px solid var(--line);
		padding: 6px 8px;
		vertical-align: top;
	}

	.table th {
		width: 180px;
		background: var(--soft);
		text-align: left;
		font-weight: 700;
	}

	.kv {
		display: grid;
		grid-template-columns: 170px 1fr;
		gap: 6px 10px;
		font-size: 11px;
	}

	.label {
		color: var(--muted);
	}

	.text-block {
		white-space: pre-line;
		line-height: 1.4;
	}

	.segment {
		margin-bottom: 10px;
		padding-bottom: 10px;
		border-bottom: 1px dashed var(--line);
	}

	.segment:last-child {
		margin-bottom: 0;
		padding-bottom: 0;
		border-bottom: 0;
	}

	.segment-head {
		display: flex;
		justify-content: space-between;
		gap: 8px;
		margin-bottom: 4px;
		font-size: 11px;
	}

	.segment-title {
		font-weight: 700;
	}

	.state-ok {
		color: #166534;
		font-weight: 700;
	}

	.state-warn {
		color: #991b1b;
		font-weight: 700;
	}

	.list {
		margin: 0;
		padding-left: 18px;
		font-size: 11px;
	}

	.list li {
		margin-bottom: 4px;
	}

	.images {
		display: grid;
		grid-template-columns: repeat(2, 1fr);
		gap: 10px;
	}

	.image-card {
		border: 1px solid var(--line);
		border-radius: 10px;
		overflow: hidden;
	}

	.image-card img {
		width: 100%;
		height: 160px;
		object-fit: cover;
		display: block;
	}

	.image-caption {
		border-top: 1px solid var(--line);
		background: #fafafa;
		padding: 6px 8px;
		font-size: 10px;
	}

	.footer {
		margin-top: 16px;
		display: flex;
		justify-content: flex-end;
		font-size: 11px;
		text-align: center;
	}

	.signature {
		min-width: 250px;
		border-top: 1px solid var(--ink);
		padding-top: 6px;
	}

	.muted {
		color: var(--muted);
	}

	.small {
		font-size: 10px;
	}

	@media print {
		body {
			background: #fff;
		}

		.page {
			padding: 0;
		}
	}
</style>
